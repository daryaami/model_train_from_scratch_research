# Пилот v001. Исходные Markdown MinerU не изменяются.
# Повтор с другими правилами — новый файл и каталог v002.

version: v001
source_dir: data/chem_dataset/chem_text_mineru
output_dir: data/chem_dataset/chem_preprocess/v001
tokenizer: tokenizers/fineweb2_rus_v001/chosen/tokenizer.json

# Оценка «страницы»: в облачном Markdown нет границ страниц.
page_window_chars: 1800
# Мусор — длинный абзац, где буквы и цифры вместе реже этого порога.
# Абзац с формулой или таблицей не снимается.
garbage_min_chars: 80
garbage_max_letter_ratio: 0.25
# Колонтитул здесь — номер страницы или повторяющаяся сноска, не подпись каталога.
header_min_repeats: 3
header_max_chars: 180
dedup_min_chars: 40
chunk_min_chars: 200
homoglyph_min_letters: 4
formula_samples: 30
table_samples: 10

books:
  - file: "А.А. Кудрявцев. Составление химических уравнений..md"
    reason: "Русский учебник с плотными химическими формулами"
  - file: "Shimanovich, Pavlovich, Tikavyj, Malashko. Obshchaja himija v formulah, opredelenijah, sxemah (ru.md"
    reason: "Формулы и таблицы; имя файла в корпусе обрезано на «(ru.md»"
  - file: "А.В. Курдюмов. Лабораторные работы по технологии литейного производства. 1990.md"
    reason: "Лабораторный практикум с таблицами"
  - file: "Эльдерфилд Р.Гетероциклические соединения т.8 1969.md"
    reason: "Схемы реакций картинками и частые переносы"
  - file: "Шулов Л.М., Хейфиц Л.А. Душистые вещества с мускусным запахом М. 1964.md"
    reason: "Плотные переносы слов в скане"
  - file: "А.Н. Ряузов и др. Технология производства химических волокон. 1980.md"
    reason: "Обычный технологический учебник"
  - file: "Molekulyarnaya biologiya.md"
    reason: "Единственная явная непрочитанная страница MinerU"
  - file: "Эткинс П. Молекулы [1991].md"
    reason: "Популярный текст, сноски и переносы"
  - file: "Яцимирский К.Б., Кольчинский А.Г., Павлищук В.В. - Синтез макроциклических соединений (1987)(ru).md"
    reason: "Средний русский учебник"
  - file: "Юрьев Ю. К. Практические работы по органической химии. вып.1-2 2-е изд., М., ИМУ, 1961.md"
    reason: "Практикум по органической химии"
  - file: "Яхимович Р.И. Химия витаминов D; 1978.md"
    reason: "Средний русский учебник"
  - file: "Энциклопедия полимеров т.2, Л-Полинозные волокна, М. Советская энциклопедия, 1974.md"
    reason: "Длинный справочник"
  - file: "гидролиз ванилина (патент 3).md"
    reason: "Короткий край выборки, почти не учебник"
  - file: "Introduction to Computation Chemistry Jensen.md"
    reason: "Английский учебник, проверка что правила не портят латиницу"
  - file: "Hoenig S. - Basic training in chemistry (Kluwer, 2002).md"
    reason: "Английский учебник с таблицами"
  - file: "The Diels-Alder Reaction.md"
    reason: "Английский текст со схемами и таблицами"
